name: Lint & Format

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "**.mmd"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "**.mmd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Clang-Format & Clang-Tidy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-lint
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install Toolchain & Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang clang-format clang-tidy cmake ninja-build \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev libxtst-dev 

      - name: Check Formatting
        run: |
          git ls-files -z '*.cpp' '*.hpp' | xargs -0 -r clang-format --dry-run --Werror

      - name: Generate Compilation Database
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run Clang-Tidy
        run: |
          git ls-files -z '*.cpp' | grep -zv '_test.cpp' | xargs -0 -r clang-tidy -p build --warnings-as-errors='*'