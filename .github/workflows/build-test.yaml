name: Build & Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "**.mmd"
  pull_request:
    branches: ["**"]
    paths-ignore:
      - "**.md"
      - "**.mmd"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: Ubuntu Build & Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-ccache-build
          restore-keys: ${{ runner.os }}-ccache-

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build g++-14 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libxss-dev libwayland-dev \
            libxkbcommon-dev libasound2-dev libpulse-dev

      - name: Configure CMake
        env:
          CXX: g++-14
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build All Targets
        run: cmake --build build

      - name: Run Unit Tests
        env:
            SDL_VIDEODRIVER: dummy
            SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build --output-on-failure -j $(nproc)
        